server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # index.html references the current build's content-hashed JS/CSS
        # filenames — it must never be cached, or browsers keep requesting
        # an old index.html that points at a bundle that no longer exists,
        # making a fresh deploy look like it "didn't take effect".
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed, immutable assets (filename changes whenever content changes) —
    # safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
